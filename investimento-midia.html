<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Investimento por campanha — Long Life" />
    <title>Long Life · Investimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/investimento-midia/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Ir ao conteúdo</a>
    <div class="ll-app">
      <aside class="ll-sidebar" id="sidebar" aria-label="Navegação">
        <div class="ll-brand">
          <span class="brand__dot"></span>
          <strong>Long Life</strong>
        </div>
        <nav class="ll-nav" aria-label="Seções">
          <a class="ll-nav__link" href="/cliente/longlife">Início</a>
          <a class="ll-nav__link is-active" href="/investimento-midia" aria-current="page">Investimento</a>
          <a class="ll-nav__link" href="/docs/longlife">Documentação</a>
        </nav>
      </aside>
      <div class="ll-column">
        <header class="ll-topbar">
          <button type="button" class="ll-icon-btn" id="btnMenu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <path fill="currentColor" d="M3 5h14v1.5H3V5zm0 4.25h14v1.5H3v-1.5zM3 13.5h14V15H3v-1.5z"/>
            </svg>
          </button>
          <h1>Investimento</h1>
        </header>

        <main id="main" class="ll-main">
          <header class="page-head">
            <p class="kicker">Long Life</p>
            <h1>Investimento por campanha</h1>
            <p>Valor no dia em que o lead entrou.</p>
          </header>

          <div class="progress-line" id="progressCard" hidden>
            <span id="progressText">0/0 lançadas</span>
            <div class="progress-bar" aria-hidden="true"><span id="progressBar" style="width:0%"></span></div>
            <span id="totalText">R$ 0,00</span>
          </div>

          <div class="toolbar">
            <label>
              Dia
              <div class="day-nav">
                <button type="button" class="secondary" id="btnDiaPrev" title="Dia anterior" aria-label="Dia anterior">←</button>
                <input type="date" id="dia" />
                <button type="button" class="secondary" id="btnDiaNext" title="Próximo dia" aria-label="Próximo dia">→</button>
              </div>
            </label>
            <label>
              Buscar
              <input type="search" id="busca" placeholder="Campanha" autocomplete="off" />
            </label>
            <label>
              Ordenar
              <select id="ordenacao">
                <option value="pendentes">Pendentes primeiro</option>
                <option value="alfabetica">Alfabética</option>
                <option value="leads">Mais leads</option>
              </select>
            </label>
            <div class="actions">
              <button type="button" id="btnSalvar">Salvar dia</button>
              <button type="button" class="secondary" id="btnCopiarDia">Copiar dia anterior</button>
              <button type="button" class="secondary" id="btnRecarregar">Recarregar</button>
            </div>
          </div>

          <div class="status-row">
            <p class="status" id="status" role="status">Carregando…</p>
            <button type="button" class="secondary" id="btnRetry" hidden>Tentar de novo</button>
          </div>
          <div id="tabelaWrap"></div>
        </main>
      </div>
    </div>

    <div class="ll-scrim" id="scrim"></div>

    <div class="sticky-save" id="stickySave">
      <div class="sticky-inner">
        <span id="stickyText">0 alterações não salvas</span>
        <button type="button" id="btnSalvarSticky">Salvar dia</button>
      </div>
    </div>

    <script type="module" src="/src/investimento-midia/main.js"></script>
  </body>
</html>
